<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Basement Rave Crew</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000; overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    canvas {
      position: fixed; inset: 0; z-index: 0;
      display: block; width: 100% !important; height: 100% !important;
      pointer-events: none;
    }
    body.playing canvas { pointer-events: auto; z-index: 1; }
    #hint {
      display: none;
      position: fixed; left: 14px; bottom: 14px; z-index: 5;
      color: #d8cfc6; font-size: 13px; text-shadow: 0 1px 3px #000;
      pointer-events: none; user-select: none;
      background: rgba(8,6,8,0.55); padding: 8px 12px; border: 1px solid #553428;
    }
    body.playing #hint { display: block; }

    /* Full-bleed original mock — no CSS font remake */
    #start {
      position: fixed;
      inset: 0;
      width: 100vw; height: 100vh;
      width: 100dvw; height: 100dvh;
      z-index: 20;
      background: #000;
      overflow: hidden;
      margin: 0; padding: 0;
    }
    #start.hidden { display: none !important; pointer-events: none !important; }
    #start .mock {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
      user-select: none;
    }
    /* Red pill ENTER (Basement mock) — pops larger on hover */
    #enterBtn {
      appearance: none; -webkit-appearance: none;
      position: absolute;
      left: 50%;
      top: 78%;
      transform: translate(-50%, -50%) scale(1);
      z-index: 30;
      margin: 0;
      padding: 0.85em 2.4em;
      min-width: min(42vw, 280px);
      border: 0;
      border-radius: 999px;
      background: #e10600;
      background: linear-gradient(180deg, #ff2a1a 0%, #e10600 45%, #b80500 100%);
      color: #fff;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      font-family: "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: clamp(20px, 3.6vw, 34px);
      font-weight: 900;
      letter-spacing: 0.28em;
      line-height: 1;
      text-indent: 0.28em;
      text-transform: uppercase;
      box-shadow:
        0 0 0 3px rgba(225, 6, 0, 0.45),
        0 10px 28px rgba(0, 0, 0, 0.55);
      transition:
        transform 0.2s cubic-bezier(0.34, 1.55, 0.64, 1),
        box-shadow 0.2s ease,
        filter 0.2s ease;
      will-change: transform;
    }
    #enterBtn:hover,
    #enterBtn:focus-visible {
      transform: translate(-50%, -50%) scale(1.16);
      filter: brightness(1.08);
      box-shadow:
        0 0 0 4px rgba(255, 80, 60, 0.55),
        0 16px 36px rgba(225, 6, 0, 0.55);
      outline: none;
    }
    #enterBtn:active {
      transform: translate(-50%, -50%) scale(0.97);
      filter: brightness(0.95);
    }
  </style>
</head>
<body>
  <div id="start">
    <img class="mock" src="landing-mock.png" alt="Basement — Mad Max Crew" />
    <button type="button" id="enterBtn" onclick="window.__basementStartGame(event)" aria-label="Enter">ENTER</button>
  </div>

  <div id="hint">↑↓ walk · ←→ turn · Shift sprint · Mouse look · Esc release</div>

  <script>
  // Landing Enter — always dismiss overlay (even on repeat calls).
  window.__basementStarted = false;
  window.__basementStartGame = function startGame(ev) {
    if (ev && ev.preventDefault) {
      try { ev.preventDefault(); ev.stopPropagation(); } catch (e) {}
    }
    const overlay = document.getElementById('start');
    if (overlay) {
      overlay.classList.add('hidden');
      overlay.style.setProperty('display', 'none', 'important');
      overlay.style.setProperty('visibility', 'hidden', 'important');
      overlay.style.setProperty('pointer-events', 'none', 'important');
      overlay.setAttribute('aria-hidden', 'true');
      try { overlay.remove(); } catch (e) {}
    }
    document.body.classList.add('playing');
    const already = window.__basementStarted;
    window.__basementStarted = true;
    const canvas = window.__basementCanvas;
    if (canvas && canvas.requestPointerLock) {
      try { canvas.requestPointerLock(); } catch (e) {}
    }
    return !already;
  };
  (function bindEnter() {
    const btn = document.getElementById('enterBtn');
    if (!btn) return;
    btn.onclick = function (e) { window.__basementStartGame(e); };
    btn.addEventListener('click', function (e) { window.__basementStartGame(e); }, true);
  })();
  </script>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="vendor/SkeletonUtils.js"></script>
  <script>
  window.__basementModels = { template: null, animations: [], mixers: [] };
  function __startBasement3D() {
    try {
    /**
     * Floorplan: hand-drawn reel DbuGUFTtIGX (+Z north, +X east)
     * Materials/lighting: Basement NY photo refs (Knockdown Center /
     * Ivane Katamashvili / Coherent) — brick arches, red haze, F1 horns.
     * Characters: real GLB humanoid (models/Xbot.glb) when loaded.
     */
    if (typeof THREE === 'undefined') throw new Error('THREE failed to load');
    const loader = new THREE.TextureLoader();
    const mats = {
      concrete: new THREE.MeshLambertMaterial({ color: 0x8a8580 }),
      concreteDark: new THREE.MeshLambertMaterial({ color: 0x3a3836 }),
      brick: new THREE.MeshLambertMaterial({ color: 0x8a5a48 }),
      brickFloor: new THREE.MeshLambertMaterial({ color: 0x5a3a32 }),
      floor: new THREE.MeshLambertMaterial({ color: 0x2a2422 }),
      outdoor: new THREE.MeshLambertMaterial({ color: 0x3a3834 }),
      asphalt: new THREE.MeshLambertMaterial({ color: 0x2c2c2a }),
      entrConcrete: new THREE.MeshLambertMaterial({ color: 0xb0aea8 }),
      rampFloor: new THREE.MeshLambertMaterial({ color: 0x3a3a38 }),
      entrBrick: new THREE.MeshLambertMaterial({ color: 0x8a5a48 }),
      rustMetal: new THREE.MeshLambertMaterial({ color: 0x5a4030 }),
      metal: new THREE.MeshLambertMaterial({ color: 0x3a3a42 }),
      metalHeavy: new THREE.MeshLambertMaterial({ color: 0x2a2a30 }),
      red: new THREE.MeshBasicMaterial({ color: 0xff4422 }),
      blue: new THREE.MeshBasicMaterial({ color: 0x4488ff }),
      orange: new THREE.MeshBasicMaterial({ color: 0xff6622 }),
      orangeE: new THREE.MeshBasicMaterial({ color: 0xff8844 }),
      whiteE: new THREE.MeshBasicMaterial({ color: 0xffffff }),
      black: new THREE.MeshLambertMaterial({ color: 0x18181c }),
      wood: new THREE.MeshLambertMaterial({ color: 0x6a4830 }),
      skin: new THREE.MeshLambertMaterial({ color: 0xb08a70 }),
      graffiti: new THREE.MeshLambertMaterial({ color: 0xd0ccc4 }),
      harness: new THREE.MeshLambertMaterial({ color: 0x0e0e10 }),
      lightAV: new THREE.MeshLambertMaterial({ color: 0x2a2a32 }),
      bathTile: new THREE.MeshLambertMaterial({ color: 0xd0cbc4 }),
      pipe: new THREE.MeshLambertMaterial({ color: 0xc8c4bc }),
      speakerWhite: new THREE.MeshLambertMaterial({ color: 0xe8e6e2 }),
    };
    function applyMap(mat, url, repeat) {
      loader.load(url, (t) => {
        t.colorSpace = THREE.SRGBColorSpace;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        if (repeat) t.repeat.set(repeat[0], repeat[1]);
        mat.map = t;
        mat.color.set(0xffffff);
        mat.needsUpdate = true;
      }, undefined, () => {});
    }
    // Photo-derived textures (textures-real/) with procedural fallbacks
    applyMap(mats.brick, 'textures-real/brick-red.jpg', [2, 2]);
    applyMap(mats.brickFloor, 'textures-real/brick-floor.jpg', [4, 4]);
    applyMap(mats.concrete, 'textures-real/concrete-industrial.jpg', [2, 2]);
    applyMap(mats.concreteDark, 'textures-real/concrete-industrial.jpg', [1.5, 1.5]);
    applyMap(mats.floor, 'textures-real/floor-dark.jpg', [5, 5]);
    applyMap(mats.outdoor, 'textures-real/gravel-yard.jpg', [6, 6]);
    applyMap(mats.asphalt, 'textures-real/entrance-asphalt.jpg', [8, 8]);
    applyMap(mats.entrConcrete, 'textures-real/entrance-concrete.jpg', [2, 3]);
    applyMap(mats.rampFloor, 'textures-real/entrance-ramp-floor.jpg', [3, 6]);
    applyMap(mats.entrBrick, 'textures-real/entrance-yard-brick.jpg', [2.5, 2.5]);
    // Do NOT map the blurry outdoor fence photo onto rustMetal — that made courtyard walls look fake
    mats.rustMetal.color.set(0x4a3828);
    applyMap(mats.bathTile, 'textures-real/bath-tile.jpg', [3, 3]);
    applyMap(mats.metalHeavy, 'textures-real/metal-heavy.jpg', [2, 2]);
    applyMap(mats.graffiti, 'GraffitiMadMax.png', null);

    const scene = new THREE.Scene();
    // Night courtyard sky (Basement exterior ref — deep purple-black)
    scene.background = new THREE.Color(0x0c0a16);
    scene.fog = new THREE.Fog(0x0c0a16, 22, 78);

    const camera = new THREE.PerspectiveCamera(70, Math.max(innerWidth, 1) / Math.max(innerHeight, 1), 0.08, 300);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setClearColor(0x1a2230, 1);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(Math.max(innerWidth, 1), Math.max(innerHeight, 1));
    renderer.shadowMap.enabled = false; // fewer black-shadow artifacts
    renderer.domElement.style.position = 'fixed';
    renderer.domElement.style.inset = '0';
    renderer.domElement.style.zIndex = '0';
    document.body.appendChild(renderer.domElement);

    // Cool night sky + warm yard fill (photo: dusk courtyard beyond gate)
    scene.add(new THREE.AmbientLight(0xb8c4d8, 0.85));
    scene.add(new THREE.HemisphereLight(0x6a7a98, 0x1a120e, 1.15));
    const key = new THREE.DirectionalLight(0xffe0c8, 1.15);
    key.position.set(10, 42, -18);
    scene.add(key);
    const yardFill = new THREE.PointLight(0xffccaa, 5.2, 70, 1.3);
    yardFill.position.set(3.5, 7, -10);
    scene.add(yardFill);
    const redWash = new THREE.PointLight(0xff4422, 3.2, 28, 1.5);
    redWash.position.set(4, 2.4, 6);
    scene.add(redWash);
    const fill = new THREE.PointLight(0xffaa66, 2.4, 35, 1.5);
    fill.position.set(10, 3.5, 12);
    scene.add(fill);

    const world = new THREE.Group();
    scene.add(world);
    const colliders = [];
    const npcs = [];

    function addBox(x, y, z, w, h, d, mat, opts = {}) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x, y, z);
      if (opts.rotY) mesh.rotation.y = opts.rotY;
      mesh.castShadow = !opts.noShadow;
      mesh.receiveShadow = true;
      world.add(mesh);
      if (!opts.noCollide) {
        // AABB approx (ignore rotation for diagonal — handled separately)
        const hw = opts.rotY ? (Math.abs(Math.cos(opts.rotY)) * w + Math.abs(Math.sin(opts.rotY)) * d) / 2 : w / 2;
        const hd = opts.rotY ? (Math.abs(Math.sin(opts.rotY)) * w + Math.abs(Math.cos(opts.rotY)) * d) / 2 : d / 2;
        colliders.push({
          min: new THREE.Vector3(x - hw, y - h / 2, z - hd),
          max: new THREE.Vector3(x + hw, y + h / 2, z + hd),
        });
      }
      return mesh;
    }

    function glow(x, y, z, color, intensity, dist) {
      const l = new THREE.PointLight(color, intensity, dist, 2);
      l.position.set(x, y, z);
      scene.add(l);
      const mat =
        color === 0xff5520 || color === 0xff6622 || color === 0xff8844 ? mats.orange :
        color === 0x3366ff || color === 0x4488ff ? mats.blue :
        color === 0xff2200 || color === 0xff2222 || color === 0xff4422 ? mats.red : mats.whiteE;
      addBox(x, y, z, 0.12, 0.12, 0.12, mat, { noCollide: true, noShadow: true });
      return l;
    }

    /** Ceiling pipe run (photo: white conduit along low ceilings). */
    function addPipe(x1, z1, x2, z2, y = 3.1) {
      const dx = x2 - x1, dz = z2 - z1;
      const len = Math.hypot(dx, dz) || 1;
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.08, len, 8),
        mats.pipe
      );
      mesh.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
      mesh.rotation.z = Math.PI / 2;
      mesh.rotation.y = Math.atan2(dz, dx);
      mesh.castShadow = true;
      world.add(mesh);
    }

    /** Funktion-One style white horn stack. */
    function addSpeakerStack(x, y, z, facing = 0) {
      const g = new THREE.Group();
      const cab = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 0.55), mats.speakerWhite);
      cab.position.y = 0;
      const horn = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.55, 0.7), mats.speakerWhite);
      horn.position.set(0, 0.85, 0.05);
      const top = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.45, 0.45), mats.black);
      top.position.y = 1.35;
      g.add(cab, horn, top);
      g.position.set(x, y, z);
      g.rotation.y = facing;
      world.add(g);
      colliders.push({
        min: new THREE.Vector3(x - 0.5, 0, z - 0.5),
        max: new THREE.Vector3(x + 0.5, 2.2, z + 0.5),
      });
    }

    /** DJ orange bulb grid (photo: 2×4 warm circles). */
    function addOrangeGrid(cx, cy, cz, cols = 4, rows = 2) {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = cx + (c - (cols - 1) / 2) * 0.55;
          const y = cy + (r - (rows - 1) / 2) * 0.55;
          addBox(x, y, cz, 0.35, 0.35, 0.12, mats.orangeE, { noCollide: true, noShadow: true });
        }
      }
      glow(cx, cy, cz - 0.5, 0xff8844, 4.5, 16);
    }

    /** Vertical orange spotlight pool on floor (photo haze beams). */
    function addSpotBeam(x, z, color = 0xff5520) {
      glow(x, 3.6, z, color, 2.2, 9);
    }

    /** Photo panel on a wall (tunnel arches / DJ backdrop). */
    function wallPanel(url, x, y, z, w, h, rotY = 0) {
      const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      applyMap(mat, url, null);
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      mesh.position.set(x, y, z);
      mesh.rotation.y = rotY;
      world.add(mesh);
      return mesh;
    }

    // Floating room labels removed — players discover the floorplan.
    function makeLabel(_text, _x, _y, _z, _scale) { return null; }

    /** Real GLB human when loaded; otherwise capsule club humanoid. */
    function makeHumanoid(opts = {}) {
      const tpl = window.__basementModels && window.__basementModels.template;
      if (tpl) {
        const root = new THREE.Group();
        // SkeletonUtils rebinds bones — Object3D.clone leaves every NPC sharing one skeleton
        // (camera ends up inside a pink Xbot surface mesh).
        const g = (THREE.SkeletonUtils && THREE.SkeletonUtils.clone)
          ? THREE.SkeletonUtils.clone(tpl)
          : tpl.clone(true);
        const scale = (opts.scale != null ? opts.scale : 1) * (0.95 + Math.random() * 0.08);
        g.scale.setScalar(scale);
        const outfit = new THREE.Color(opts.color != null ? opts.color : 0x121216);
        const pantsCol = new THREE.Color(opts.pants != null ? opts.pants : 0x1a2744);
        const skinTone = new THREE.Color(opts.skin != null ? opts.skin : 0xb08a70);
        g.traverse((child) => {
          if (!child.isMesh) return;
          child.castShadow = true;
          child.receiveShadow = true;
          // Avoid near-plane clipping into dense skinned geo when the cam pulls in
          if (child.isSkinnedMesh) child.frustumCulled = false;
          if (child.material) {
            const wasArr = Array.isArray(child.material);
            const matsArr = wasArr ? child.material : [child.material];
            const cloned = matsArr.map((m) => {
              const c = m.clone();
              if (c.side == null) c.side = THREE.FrontSide;
              const n = ((child.name || '') + ' ' + (m.name || '')).toLowerCase();
              // Xbot ships as pink robot (Beta_HighLimbs) + brown joints — recolor to club humans
              if (/joint/i.test(n)) {
                c.color = outfit.clone().multiplyScalar(0.55);
              } else if (/limb|surface|beta|body|skin|mesh/i.test(n) || !n.trim()) {
                // Mostly black techno fit with a hint of skin so faces read as human
                c.color = skinTone.clone().lerp(outfit, 0.72);
                if (opts.pants != null) c.color.lerp(pantsCol, 0.15);
              }
              if (c.metalness != null) c.metalness = 0.05;
              if (c.roughness != null) c.roughness = 0.85;
              return c;
            });
            child.material = wasArr ? cloned : cloned[0];
          }
        });
        // Mad Max harness accent on chest
        const accent = opts.accent != null ? opts.accent : 0xe10600;
        const strapL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.45, 0.03), new THREE.MeshLambertMaterial({ color: accent }));
        strapL.position.set(-0.08, 1.25, 0.12);
        strapL.rotation.z = 0.28;
        const strapR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.45, 0.03), new THREE.MeshLambertMaterial({ color: accent }));
        strapR.position.set(0.08, 1.25, 0.12);
        strapR.rotation.z = -0.28;
        root.add(g, strapL, strapR);
        // Idle only (never walk/run — those displace root and swallow the camera)
        const clips = window.__basementModels.animations || [];
        if (clips.length && THREE.AnimationMixer && opts.animate !== false) {
          const mixer = new THREE.AnimationMixer(g);
          const idle = clips.find((c) => /^idle$/i.test(c.name))
            || clips.find((c) => /idle|stand|breath/i.test(c.name));
          if (idle) {
            const action = mixer.clipAction(idle);
            action.clampWhenFinished = true;
            action.play();
            window.__basementModels.mixers.push(mixer);
          }
        }
        root.userData.torso = g;
        return root;
      }

      const g = new THREE.Group();
      const scale = opts.scale != null ? opts.scale : 0.96 + Math.random() * 0.1;
      g.scale.setScalar(scale);
      const outfit = opts.color != null ? opts.color : 0x121216;
      const pantsCol = opts.pants != null ? opts.pants : (Math.random() < 0.5 ? 0x1a2744 : 0x15151a);
      const skinTone = opts.skin != null ? opts.skin : [0xb08a70, 0x8d6a55, 0xc4a07e, 0x6b4a38][(Math.random() * 4) | 0];
      const hairCol = opts.hair != null ? opts.hair : [0x1a1a1a, 0xd8c48a, 0x2a1810, 0x55555c][(Math.random() * 4) | 0];
      const cloth = new THREE.MeshLambertMaterial({ color: outfit });
      const pantsM = new THREE.MeshLambertMaterial({ color: pantsCol });
      const skinM = new THREE.MeshLambertMaterial({ color: skinTone });
      const hairM = new THREE.MeshLambertMaterial({ color: hairCol });
      const accent = opts.accent != null ? opts.accent : 0xe10600;
      const Cap = THREE.CapsuleGeometry
        ? (r, len) => new THREE.CapsuleGeometry(r, len, 4, 10)
        : (r, len) => new THREE.CylinderGeometry(r, r, len + r * 2, 10);

      const hips = new THREE.Mesh(Cap(0.17, 0.14), pantsM);
      hips.position.y = 0.9;
      const torso = new THREE.Mesh(Cap(0.19, 0.42), cloth);
      torso.position.y = 1.3;
      const chest = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), cloth);
      chest.position.set(0, 1.42, 0.02);
      chest.scale.set(1.15, 0.7, 0.85);
      const shoulderL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), cloth);
      shoulderL.position.set(-0.24, 1.48, 0);
      const shoulderR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), cloth);
      shoulderR.position.set(0.24, 1.48, 0);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), skinM);
      head.position.y = 1.78;
      const hair = new THREE.Mesh(new THREE.SphereGeometry(0.145, 12, 10), hairM);
      hair.position.y = 1.86;
      hair.scale.set(1.08, 0.65, 1.08);
      if (opts.spiky || Math.random() < 0.35) {
        for (let i = 0; i < 6; i++) {
          const spike = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.14, 5), hairM);
          const a = (i / 6) * Math.PI * 2;
          spike.position.set(Math.cos(a) * 0.07, 1.95, Math.sin(a) * 0.05);
          g.add(spike);
        }
      }
      const neck = new THREE.Mesh(Cap(0.055, 0.07), skinM);
      neck.position.y = 1.58;

      const legL = new THREE.Mesh(Cap(0.075, 0.4), pantsM);
      legL.position.set(-0.1, 0.55, 0);
      const legR = new THREE.Mesh(Cap(0.075, 0.4), pantsM);
      legR.position.set(0.1, 0.55, 0);
      const bootL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.16, 0.28), mats.black);
      bootL.position.set(-0.1, 0.2, 0.04);
      const bootR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.16, 0.28), mats.black);
      bootR.position.set(0.1, 0.2, 0.04);

      const armL = new THREE.Mesh(Cap(0.05, 0.4), skinM);
      armL.position.set(-0.3, 1.2, 0);
      armL.rotation.z = 0.2;
      const armR = new THREE.Mesh(Cap(0.05, 0.4), skinM);
      armR.position.set(0.3, 1.2, 0);
      armR.rotation.z = -0.2;

      const strapL = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.48, 0.03), new THREE.MeshLambertMaterial({ color: accent }));
      strapL.position.set(-0.08, 1.32, 0.14);
      strapL.rotation.z = 0.3;
      const strapR = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.48, 0.03), new THREE.MeshLambertMaterial({ color: accent }));
      strapR.position.set(0.08, 1.32, 0.14);
      strapR.rotation.z = -0.3;
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.014, 6, 12), mats.metal);
      ring.position.set(0, 1.18, 0.16);
      ring.rotation.x = Math.PI / 2;

      g.add(hips, torso, chest, shoulderL, shoulderR, head, hair, neck, legL, legR, bootL, bootR, armL, armR, strapL, strapR, ring);
      if (opts.coat || Math.random() < 0.2) {
        const coat = new THREE.Mesh(Cap(0.26, 0.62), new THREE.MeshLambertMaterial({ color: 0x0a0a0c }));
        coat.position.set(0, 1.18, -0.02);
        coat.scale.set(1.2, 1, 0.9);
        g.add(coat);
      }
      g.userData.torso = torso;
      return g;
    }

    function makeNPC(x, z, opts = {}) {
      const group = makeHumanoid(opts);

      npcs.push({
        group,
        mode: opts.mode || 'idle',
        base: new THREE.Vector3(x, 0, z),
        phase: Math.random() * Math.PI * 2,
        speed: 0.8 + Math.random() * 1.2,
        radius: opts.radius || 0.6,
      });
      return group;
    }

    function spawnCrowd(cx, cz, count, mode, spreadX, spreadZ) {

          cz + (Math.random() - 0.5) * spreadZ,
          {
            mode,
            coat: Math.random() < 0.15,
            color: Math.random() < 0.7 ? 0x121216 : 0x1a1520,

    function roomShell(cx, cz, w, d, wallH, ceiling) {

    // ========== LAYOUT (reel map DbuGUFTtIGX — watch coords ×0.42) ==========
    // Map 0..100 (W→E, S→N). +Z north, +X east. Source: Watch floorplan reel.

    const X = (mx) => mx * S;

    const W = (a, b) => (b - a) * S;

      return 0;

    // Bottom toilet corridor 80-85, 0-30 + room 80-100, 0-15
    addBox(CX(80, 86), 0.05, CZ(5, 32), W(80, 86), 0.1, W(5, 32), mats.brickFloor, { noShadow: true });

    addBox(CX(80, 100), 0.05, CZ(0, 15), W(80, 100), 0.1, W(0, 15), mats.bathTile, { noShadow: true });
    addBox(CX(80, 100), 1.5, Z(0), W(80, 100), 3.0, 0.4, mats.bathTile);
    addBox(CX(80, 100), 1.5, Z(15), W(80, 94), 3.0, 0.4, mats.bathTile);
    addBox(X(100), 1.5, CZ(0, 15), 0.4, 3.0, W(0, 15), mats.bathTile);
    addBox(X(80), 1.5, CZ(0, 10), 0.4, 3.0, W(0, 10), mats.bathTile);
    addBox(X(80), 1.5, CZ(13, 15), 0.4, 3.0, W(13, 15), mats.bathTile);
    addBox(CX(80, 100), 3.05, CZ(0, 15), W(80, 100), 0.1, W(0, 15), mats.concreteDark, { noShadow: true });
    {

    addBox(X(81), 1.6, Z(7), 0.12, 2.6, 4, mats.graffiti, { noCollide: true });
    for (let i = 0; i < 4; i++) addBox(X(86 + (i % 2) * 4), 1.15, Z(4 + Math.floor(i / 2) * 4), 0.12, 2.2, 1.1, mats.metal);
    makeLabel('BATHROOM · MAD MAX', X(90), 3.3, Z(7), 4.2);
    spawnCrowd(X(92), Z(8), 6, 'loiter', 5, 3);

    // Indoor west wall only (do not seal the outdoor courtyard into a black box)
    addBox(X(-1), 1.5, CZ(20, 100), 0.4, 3, W(20, 100), mats.brick);

    // Spawn south of the queue — clear courtyard establishing shot toward the gate
    const player = {
      pos: new THREE.Vector3(X(10), 0, Z(-28)),
      yaw: Math.PI, // face +Z (north) toward gate/ramp
      pitch: 0.18,  // slight look-down for third-person
      speed: 6.2,
      turnSpeed: 3.4, // ←→ turns the view with the body
      radius: 0.35,
    };

    // Player avatar — same humanoid language as crowd (harness crew)
    const avatar = makeHumanoid({
      color: 0x1a1a22,
      pants: 0x1c2a4a,
      skin: 0xb08a70,
      hair: 0xd8c48a,
      accent: 0xe10600,
      scale: 1.0,
      spiky: true,
      animate: true,
    });
    world.add(avatar);

    const keys = {};
    addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Escape') document.exitPointerLock();
      if (e.code.startsWith('Arrow')) e.preventDefault();
    });
    addEventListener('keyup', (e) => { keys[e.code] = false; });
    addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== renderer.domElement) return;
      // Mouse still yaws for fine look; primary turn is ← →
      player.yaw -= e.movementX * 0.0022;
      player.pitch -= e.movementY * 0.0015;
      player.pitch = Math.max(0.05, Math.min(0.55, player.pitch));
    });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    window.__basementCanvas = renderer.domElement;
    if (window.__basementStarted) {
      try { renderer.domElement.requestPointerLock(); } catch (e) {}
    }
    renderer.domElement.addEventListener('click', () => {
      if (!window.__basementStarted) {
        window.__basementStartGame();
        return;
      }
      if (document.pointerLockElement !== renderer.domElement) {
        try { renderer.domElement.requestPointerLock(); } catch (e) {}
      }
    });
    const enterBtn = document.getElementById('enterBtn');
    if (enterBtn) {
      enterBtn.onclick = function (e) {
        window.__basementStartGame(e);
        try { renderer.domElement.requestPointerLock(); } catch (err) {}
      };
    }

    function collide(nx, nz) {
      const r = player.radius;
      const gy = groundY(nx, nz);
      const yLo = gy + 0.35;
      const yHi = gy + 2.15;
      for (const b of colliders) {
        if (b.max.y < yLo || b.min.y > yHi) continue;
        const cx = Math.max(b.min.x, Math.min(nx, b.max.x));
        const cz = Math.max(b.min.z, Math.min(nz, b.max.z));
        const dx = nx - cx, dz = nz - cz;
        if (dx * dx + dz * dz < r * r) return true;
      }
      return false;
    }

    let last = performance.now();
    function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const t = now * 0.001;

      for (const n of npcs) {
        const g = n.group;
        if (n.mode === 'dance') {
          g.position.y = Math.abs(Math.sin(t * n.speed * 3 + n.phase)) * 0.18;
          g.rotation.y += dt * 0.6;
          const torso = g.userData.torso || g.children[0];
          if (torso) torso.scale.y = 1 + Math.sin(t * n.speed * 4 + n.phase) * 0.06;
        } else if (n.mode === 'loiter') {
          g.position.x = n.base.x + Math.sin(t * 0.4 + n.phase) * n.radius;
          g.position.z = n.base.z + Math.cos(t * 0.35 + n.phase) * n.radius * 0.6;
          g.rotation.y = Math.atan2(
            Math.cos(t * 0.4 + n.phase),
            -Math.sin(t * 0.35 + n.phase)
          );
        } else if (n.mode === 'queue') {
          g.position.y = Math.sin(t * 1.2 + n.phase) * 0.03;
        }
      }

      if (window.__basementStarted) {
        // ← → turn in place (not strafe); ↑ ↓ walk relative to facing
        if (keys['ArrowLeft']) player.yaw += player.turnSpeed * dt;
        if (keys['ArrowRight']) player.yaw -= player.turnSpeed * dt;

        const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
        const sp = player.speed * (sprint ? 1.65 : 1);
        let move = 0;
        if (keys['ArrowUp']) move += 1;
        if (keys['ArrowDown']) move -= 1;
        if (move) {
          const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
          const dx = forward.x * move * sp * dt;
          const dz = forward.z * move * sp * dt;
          let nx = player.pos.x + dx;
          let nz = player.pos.z + dz;
          nx = Math.max(playMinX, Math.min(playMaxX, nx));
          nz = Math.max(playMinZ, nz);
          if (!collide(nx, player.pos.z)) player.pos.x = nx;
          if (!collide(player.pos.x, nz)) player.pos.z = nz;
        }
      }

      // Keep player inside the yard even if collision missed a gap
      player.pos.x = Math.max(playMinX, Math.min(playMaxX, player.pos.x));
      player.pos.z = Math.max(playMinZ, player.pos.z);

      const gy = groundY(player.pos.x, player.pos.z);
      player.pos.y = gy;
      avatar.position.set(player.pos.x, gy, player.pos.z);
      // Mesh faces +Z; walk forward is (-sin yaw, -cos yaw) → offset body by π so turn = face = view
      avatar.rotation.y = player.yaw + Math.PI;

      // Third-person cam: stay in bounds, never clip inside the avatar/walls
      function camHitsWall(x, y, z) {
        const r = 0.45;
        for (const b of colliders) {
          // Ignore thin floor slabs so the follow cam does not collapse into the body
          if (b.max.y - b.min.y < 0.35) continue;
          if (y < b.min.y - 0.2 || y > b.max.y + 0.35) continue;
          const cx = Math.max(b.min.x, Math.min(x, b.max.x));
          const cz = Math.max(b.min.z, Math.min(z, b.max.z));
          const dx = x - cx, dz = z - cz;
          if (dx * dx + dz * dz < r * r) return true;
        }
        return false;
      }
      const camPad = 0.9;
      const camMinX = playMinX + camPad, camMaxX = playMaxX - camPad;
      const camMinZ = playMinZ + camPad;
      const headX = player.pos.x, headY = gy + 1.55, headZ = player.pos.z;
      // Stay behind the body (≥2.6m) so we never render the inside of the skinned mesh
      const minDist = 2.6;
      let dist = 5.2;
      let camX = headX, camY = gy + 2.6, camZ = headZ;
      for (let i = 0; i < 14; i++) {
        camX = headX + Math.sin(player.yaw) * dist;
        camZ = headZ + Math.cos(player.yaw) * dist;
        camY = gy + 2.55 + player.pitch * 1.1;
        const inYard = camX >= camMinX && camX <= camMaxX && camZ >= camMinZ;
        if (inYard && !camHitsWall(camX, camY, camZ)) break;
        dist = Math.max(minDist, dist * 0.78);
        if (dist <= minDist + 0.01) break;
      }
      camX = Math.max(camMinX, Math.min(camMaxX, camX));
      camZ = Math.max(camMinZ, camZ);
      if (camHitsWall(camX, camY, camZ)) {
        camX = headX + Math.sin(player.yaw) * minDist;
        camZ = headZ + Math.cos(player.yaw) * minDist;
        camY = gy + 2.35;
        camX = Math.max(camMinX, Math.min(camMaxX, camX));
        camZ = Math.max(camMinZ, camZ);
      }
      camera.position.set(camX, camY, camZ);
      camera.near = 0.25;
      // Look past the shoulders into the yard / gate — not into the torso
      camera.lookAt(
        headX - Math.sin(player.yaw) * 4.5,
        gy + 1.55,
        headZ - Math.cos(player.yaw) * 4.5
      );

      for (const m of window.__basementModels.mixers) m.update(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    } catch (err) {
      console.error('Basement 3D init failed', err);
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;left:12px;top:12px;z-index:50;max-width:420px;padding:12px;background:#400;color:#fff;font:13px sans-serif';
      el.textContent = '3D failed to start: ' + (err && err.message ? err.message : String(err));
      document.body.appendChild(el);
    }
  }
  // Load real humanoid GLB first, then boot the club (capsule fallback if load fails)
  (function boot() {
    const go = () => __startBasement3D();
    if (typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined') {
      console.warn('GLTFLoader missing — capsule people fallback');
      go();
      return;
    }
    const loader = new THREE.GLTFLoader();
    loader.load(
      'models/Xbot.glb',
      (gltf) => {
        window.__basementModels.template = gltf.scene;
        window.__basementModels.animations = gltf.animations || [];
        go();
      },
      undefined,
      (err) => {
        console.warn('Xbot.glb failed', err);
        go();
      }
    );
  })();
